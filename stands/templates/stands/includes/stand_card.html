<article class="card stand-card mb-3">
    {% if stand.image %}
        <img
            src="{{ stand.image.url }}"
            alt="{{ stand.name }}"
            class="card-img-top stand-image"
        >
    {% endif %}
    <div class="card-body">
        <h2 class="card-title h4">
            {{ stand.name|default:"Без названия" }}
            {% if stand.is_large %}
                <span class="badge bg-warning text-dark">Большой</span>
            {% endif %}
        </h2>

        <p class="card-text">
            Тип: {{ stand.stand_type }}
            · Площадь: {{ stand.area|floatformat:1 }} кв.м.
        </p>

        <a
            href="{{ stand.get_absolute_url }}"
            class="btn btn-primary"
        >
            Подробнее
        </a>
    </div>
</article>
